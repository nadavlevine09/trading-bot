# Company reference table for the news-sentiment trading bot.
# Loader: src/config/companies.py  →  CompanyInfo dataclass
#
# Fields
# ──────
# company_name             Primary name used in NER matching and NewsAPI queries.
# aliases                  Alternate legal / brand names (e.g. Alphabet for GOOGL).
#                          Included in query expansion; checked in relevance filter.
# subsidiaries             Distinct subsidiary / product brands that generate standalone
#                          headlines without naming the parent company (e.g. "Xbox").
#                          Used for query expansion and relevance filter (title-only).
# associated_people        Named individuals whose statements materially move this stock.
#                          Intended for future sentiment attribution / signal weighting.
# finance_source_whitelist Sources consistently treated as high-confidence financial
#                          reporting.  Used to up-weight or trust-gate signals.
#                          Optional — omit or leave empty to skip.

